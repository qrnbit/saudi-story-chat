<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قصص">
<meta name="theme-color" content="#0e1016">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<title>سوالف وقصص</title>
<style>
  :root{
    --bg:#0e1016; --panel:#151821; --panel2:#1b1f2a; --line:#262b38;
    --text:#ece8df; --muted:#8d93a3; --gold:#d4af5f; --gold2:#e8c87d;
    --user:#2a3550; --bot:#1a1e28; --danger:#e0605a;
    --app-h:100dvh;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}
  body{font-family:"Tajawal","IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  .hidden{display:none!important}

  /* ---------- Chat layout ---------- */
  #app{position:fixed;top:0;left:0;right:0;height:var(--app-h);display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;display:flex;align-items:center;gap:10px;
    padding:calc(var(--st) + 8px) calc(var(--sr) + 14px) 10px calc(var(--sl) + 14px);
    background:rgba(21,24,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  header .title{flex:1;min-width:0}
  header h1{margin:0;font-size:19px;font-weight:700;color:var(--gold2)}
  header small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
  .iconbtn{min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:15px;padding:0 12px}
  .iconbtn:active{transform:scale(.96)}

  #log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:16px calc(var(--sr) + 12px) 16px calc(var(--sl) + 12px);display:flex;flex-direction:column;gap:12px}
  .empty{margin:auto;text-align:center;color:var(--muted);line-height:1.9;padding:20px}
  .empty b{color:var(--gold2);font-size:22px;display:block;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:15px;min-height:44px}

  .msg{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.95;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;animation:pop .18s ease-out}
  .msg.user{align-self:flex-start;background:var(--user);border-bottom-right-radius:6px}
  .msg.assistant{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px}
  .msg .tools{display:flex;justify-content:flex-start;gap:6px;margin-top:8px}
  .msg .tools button{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);min-height:34px}
  .note,.error{align-self:center;font-size:14px;padding:9px 14px;border-radius:12px;max-width:92%;text-align:center;line-height:1.7}
  .note{background:#2e2a1c;color:#e9d9a8}
  .error{background:#3a1a1c;color:#f3c3c0}
  .error button{margin-top:6px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.08);display:block;margin-inline:auto;min-height:40px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .typing{align-self:flex-end;background:var(--bot);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;padding:12px 16px;max-width:88%}
  .typing .row{display:flex;align-items:center;gap:10px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.35;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .typing .hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}

  /* ---------- Composer ---------- */
  footer{flex:none;background:rgba(21,24,33,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:8px calc(var(--sr) + 10px) calc(var(--sb) + 8px) calc(var(--sl) + 10px)}
  .quick{display:flex;gap:8px;margin-bottom:8px}
  .quick button{padding:8px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:15px;min-height:40px}
  .quick button.gold{border-color:#5b4c2a;color:var(--gold2)}
  form{display:flex;align-items:flex-end;gap:8px}
  textarea{flex:1;resize:none;min-height:46px;max-height:160px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:inherit;
    padding:11px 16px;font:inherit;font-size:17px;line-height:1.5;outline:none;-webkit-appearance:none}
  textarea:focus{border-color:#4a4230}
  #send{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;display:grid;place-items:center}
  #send svg{width:22px;height:22px;transform:scaleX(-1)}
  #send.stop{background:var(--panel2);color:var(--danger);border:1px solid var(--line)}
  #send:disabled{opacity:.45}

  /* ---------- Lock screen ---------- */
  #lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#232838 0%,#0e1016 60%);
    padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);user-select:none;-webkit-user-select:none}
  #lock .lk{font-size:30px;margin-bottom:8px}
  #lock h2{margin:0 0 6px;font-weight:500;font-size:20px}
  #lock .sub{color:var(--muted);font-size:14px;height:22px;margin-bottom:22px;transition:color .2s}
  #lock .sub.bad{color:var(--danger)}
  .pindots{display:flex;gap:18px;margin-bottom:40px;direction:ltr}
  .pindots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text);transition:background .12s}
  .pindots span.on{background:var(--text)}
  .shake{animation:shake .45s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
  .pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;direction:ltr}
  .pad button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.09);font-size:32px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .pad button small{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}
  .pad button:active{background:rgba(255,255,255,.28)}
  .pad button.txt{background:none;font-size:16px}
  .pad button.txt:active{background:none;opacity:.5}
  .pad button:disabled{opacity:.4}
</style>
</head>
<body>

<!-- PIN lock screen. The PIN is NOT in this file: every attempt is checked by the server (/auth). -->
<div id="lock">
  <div class="lk">🔒</div>
  <h2>أدخل رمز الدخول</h2>
  <div class="sub" id="lockMsg"></div>
  <div class="pindots" id="pinDots"></div>
  <div class="pad" id="pad"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="title"><h1>سوالف وقصص 📖</h1><small id="model">...</small></div>
    <button class="iconbtn" id="newChat" aria-label="محادثة جديدة">جديد</button>
    <button class="iconbtn" id="lockBtn" aria-label="قفل">🔒</button>
  </header>
  <main id="log"></main>
  <footer>
    <div class="quick">
      <button type="button" class="gold" id="cont">كمل ✍️</button>
    </div>
    <form id="f">
      <textarea id="t" rows="1" enterkeyhint="send" placeholder="اكتب طلبك..."></textarea>
      <button id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg></button>
    </form>
  </footer>
</div>

<script>
// The UI knows nothing about the model: it only talks to /auth, /chat and /info.
const $ = id => document.getElementById(id);
const app=$('app'), lock=$('lock'), log=$('log'), t=$('t'), send=$('send');
const SEND_ICON = send.innerHTML;
let messages = JSON.parse(localStorage.getItem('chat') || '[]');
let password = sessionStorage.getItem('pw') || '';
let PIN_LEN = 5, busy = false, controller = null;

/* ---------- Keep the layout above the iOS keyboard ---------- */
function fitViewport(){
  const vv = window.visualViewport;
  if(vv){ app.style.height = vv.height+'px'; app.style.transform = 'translateY('+vv.offsetTop+'px)'; }
}
if(window.visualViewport){ visualViewport.addEventListener('resize', ()=>{fitViewport(); scrollDown();}); visualViewport.addEventListener('scroll', fitViewport); }
fitViewport();

/* ---------- PIN lock ----------
   Quirk requested by the owner: the correct PIN has to be entered 4 times.
   The first 3 correct entries look exactly like a wrong PIN; the 4th unlocks.
   Wrong PINs never count. The count lives in sessionStorage and resets on unlock. */
let pin = '', checking = false;
const keys = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['clear','مسح'],['0',''],['del','حذف']];
keys.forEach(([k,sub])=>{
  const b=document.createElement('button'); b.type='button';
  if(k==='clear'||k==='del'){ b.className='txt'; b.textContent=sub; }
  else b.innerHTML = k + (sub?'<small>'+sub+'</small>':'<small>&nbsp;</small>');
  b.addEventListener('click', ()=>press(k));
  $('pad').appendChild(b);
});
function drawDots(){ $('pinDots').innerHTML = Array.from({length:PIN_LEN},(_,i)=>'<span class="'+(i<pin.length?'on':'')+'"></span>').join(''); }
function press(k){
  if(checking) return;
  if(k==='del') pin = pin.slice(0,-1);
  else if(k==='clear') pin = '';
  else if(pin.length < PIN_LEN) pin += k;
  $('lockMsg').textContent=''; $('lockMsg').classList.remove('bad');
  drawDots();
  if(pin.length === PIN_LEN) checkPin();
}
document.addEventListener('keydown', e=>{ if(lock.classList.contains('hidden')) return; if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('del'); });
function reject(msg){
  const d=$('pinDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  if(navigator.vibrate) navigator.vibrate(200);
  $('lockMsg').textContent = msg || 'الرمز غلط، جرّب مرة ثانية'; $('lockMsg').classList.add('bad');
  setTimeout(()=>{ pin=''; drawDots(); }, 350);
}
async function checkPin(){
  checking = true; const attempt = pin;
  try{
    const r = await fetch('auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:attempt})});
    if(r.status===429){ reject('محاولات كثيرة، استنى دقيقة'); return; }
    if(!r.ok){ reject(); return; }               // genuinely wrong: does not count
    const n = (parseInt(sessionStorage.getItem('pinOk')||'0',10) || 0) + 1;
    if(n < 4){ sessionStorage.setItem('pinOk', String(n)); reject(); return; }  // correct, but looks wrong
    sessionStorage.setItem('pinOk','0');
    password = attempt; sessionStorage.setItem('pw', password);
    unlock();
  }catch(e){ reject('ما فيه اتصال، جرّب مرة ثانية'); }
  finally{ checking = false; }
}
function showLock(msg){
  password=''; sessionStorage.removeItem('pw'); pin=''; drawDots();
  $('lockMsg').textContent = msg||''; $('lockMsg').classList.toggle('bad', !!msg);
  app.classList.add('hidden'); lock.classList.remove('hidden'); t.blur();
}
function unlock(){ pin=''; lock.classList.add('hidden'); app.classList.remove('hidden'); fitViewport(); render(); }
$('lockBtn').onclick = ()=>showLock();

/* ---------- Messages ---------- */
function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>'); }
function save(){ localStorage.setItem('chat', JSON.stringify(messages)); }
function scrollDown(smooth){ requestAnimationFrame(()=>log.scrollTo({top:log.scrollHeight, behavior: smooth?'smooth':'auto'})); }
function copyText(text, btn){
  const done=()=>{ const o=btn.textContent; btn.textContent='تم النسخ ✓'; setTimeout(()=>btn.textContent=o,1500); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>legacy()); } else legacy();
  function legacy(){ const a=document.createElement('textarea'); a.value=text; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); a.setSelectionRange(0,text.length); try{document.execCommand('copy'); done();}catch(e){} a.remove(); }
}
function bubble(role, text){
  const d=document.createElement('div'); d.className='msg '+role;
  const body=document.createElement('div'); body.innerHTML=fmt(text); d.appendChild(body);
  if(role==='assistant'){
    const tools=document.createElement('div'); tools.className='tools';
    const c=document.createElement('button'); c.type='button'; c.textContent='نسخ'; c.onclick=()=>copyText(text,c);
    tools.appendChild(c); d.appendChild(tools);
  }
  log.appendChild(d); return d;
}
function sysLine(cls, text, retry){
  const d=document.createElement('div'); d.className=cls; d.textContent=text;
  if(retry){ const b=document.createElement('button'); b.type='button'; b.textContent='أعد المحاولة'; b.onclick=()=>{ d.remove(); retry(); }; d.appendChild(b); }
  log.appendChild(d); scrollDown(true); return d;
}
function emptyState(){
  log.innerHTML = '<div class="empty"><b>هلا فيك 👋</b>قل لي وش القصة اللي في بالك، وأنا أكتبها لك.<div class="chips"></div></div>';
  ['قصة رحلة بر في الشتاء','قصة غموض في جدة القديمة','قصة حب بين اثنين التقوا صدفة'].forEach(s=>{
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=s; b.onclick=()=>submit('اكتب لي '+s);
    log.querySelector('.chips').appendChild(b);
  });
}
function render(){ log.innerHTML=''; if(!messages.length) emptyState(); else messages.forEach(m=>bubble(m.role,m.content)); scrollDown(); }

function typing(){
  const d=document.createElement('div'); d.className='typing';
  d.innerHTML='<div class="row"><span class="dots"><i></i><i></i><i></i></span><span>يكتب... <span class="sec">0</span> ث</span></div><div class="hint">القصص الطويلة تاخذ عادة من نص دقيقة لدقيقتين، خلك معي.</div>';
  log.appendChild(d); scrollDown(true);
  const start=Date.now(); const iv=setInterval(()=>{ const s=Math.round((Date.now()-start)/1000); d.querySelector('.sec').textContent=s;
    if(s===150) d.querySelector('.hint').textContent='الطابور زحمة شوي، باقي شوي إن شاء الله...'; },1000);
  return {remove(){ clearInterval(iv); d.remove(); }};
}
function setBusy(b){
  busy=b; $('cont').disabled=b;
  send.classList.toggle('stop', b); send.setAttribute('aria-label', b?'إيقاف':'إرسال');
  send.innerHTML = b ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' : SEND_ICON;
}

async function submit(text){
  text = (text||'').trim(); if(!text || busy) return;
  if(!messages.length) log.innerHTML='';
  messages.push({role:'user',content:text}); bubble('user',text); save(); scrollDown(true);
  setBusy(true); const wait = typing(); controller = new AbortController();
  try{
    const r = await fetch('chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','X-App-Password':password},body:JSON.stringify({messages})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      if(r.status===401){ wait.remove(); messages.pop(); save(); setBusy(false); showLock('انتهت الجلسة، أدخل الرمز من جديد'); return; }
      if(r.status===429) throw new Error('طلبات كثيرة، استنى دقيقة وجرّب');
      throw new Error((typeof data.detail==='string' && data.detail) || data.error || ('HTTP '+r.status));
    }
    wait.remove();
    messages.push({role:'assistant',content:data.reply}); save();
    const b = bubble('assistant',data.reply);
    if(data.fallback_used) sysLine('note','المزود الأساسي ما رد، فجاوب Pollinations بداله.');
    requestAnimationFrame(()=>log.scrollTo({top:b.offsetTop-10,behavior:'smooth'}));
  }catch(err){
    wait.remove(); messages.pop(); save();
    if(err.name==='AbortError') sysLine('note','وقّفت الطلب.');
    else sysLine('error','صار خطأ: '+err.message, ()=>submit(text));
    if(!t.value) { t.value=text; grow(); }
  }finally{ setBusy(false); controller=null; }
}

function grow(){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,160)+'px'; }
t.addEventListener('input', grow);
// On iPhone, Return adds a new line; use the send button. On desktop, Enter sends.
const touch = matchMedia('(pointer:coarse)').matches;
t.addEventListener('keydown', e=>{ if(!touch && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('f').requestSubmit(); } });
t.addEventListener('focus', ()=>setTimeout(()=>{fitViewport();scrollDown();},300));
$('f').addEventListener('submit', e=>{
  e.preventDefault();
  if(busy){ if(controller) controller.abort(); return; }
  const v=t.value; t.value=''; grow(); submit(v);
});
$('cont').onclick = ()=>submit('كمل');
$('newChat').onclick = ()=>{ if(busy) return; if(messages.length && !confirm('تبي تبدأ محادثة جديدة؟ بتنمسح المحادثة الحالية.')) return; messages=[]; save(); render(); };

fetch('info').then(r=>r.json()).then(i=>{
  if(i.pin_length) { PIN_LEN = i.pin_length; drawDots(); }
  $('model').textContent = i.provider + (i.fallback ? ' · + احتياطي' : '');
}).catch(()=>{});

drawDots();
if(password) unlock(); else showLock();
</script>
</body>
</html>
