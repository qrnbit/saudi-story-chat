<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوالف وقصص</title>
<style>
  body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#0f1115;color:#e8e8e8;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 16px;background:#161a22;border-bottom:1px solid #262b36;display:flex;justify-content:space-between;align-items:center}
  header small{color:#8a93a6;direction:ltr}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.8}
  .user{align-self:flex-start;background:#2b5cff}
  .assistant{align-self:flex-end;background:#1d222d}
  .error{align-self:center;background:#5a1d1d;font-size:14px}
  .note{align-self:center;background:#3a3420;font-size:13px}
  form{display:flex;gap:8px;padding:12px;background:#161a22;border-top:1px solid #262b36}
  textarea{flex:1;resize:none;height:56px;border-radius:10px;border:1px solid #2f3542;background:#0f1115;color:inherit;padding:10px;font:inherit}
  button{border:0;border-radius:10px;padding:0 18px;background:#2b5cff;color:#fff;font:inherit;cursor:pointer}
  button.secondary{background:#2f3542}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header><strong>سوالف وقصص 📖</strong><small id="model">...</small></header>
<div id="log"></div>
<form id="f">
  <textarea id="t" placeholder="اكتب طلبك... مثلاً: اكتب لي قصة عن رحلة بر في الشتاء"></textarea>
  <button id="send">إرسال</button>
  <button type="button" class="secondary" id="clear">جديد</button>
</form>
<script>
// The UI knows nothing about the model: it only talks to /chat and /info.
const log = document.getElementById('log'), t = document.getElementById('t'), send = document.getElementById('send');
let messages = JSON.parse(localStorage.getItem('chat') || '[]');
// The password is NOT stored in this file. The user types it once per browser
// session; it is kept in sessionStorage and sent in the X-App-Password header.
let password = sessionStorage.getItem('pw') || '';
function askPassword(){
  password = prompt('أدخل كلمة المرور:') || '';
  sessionStorage.setItem('pw', password);
}
if(!password) askPassword();

function add(role, text){ const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
function save(){ localStorage.setItem('chat', JSON.stringify(messages)); }
messages.forEach(m => add(m.role, m.content));

fetch('info').then(r=>r.json()).then(i=>{ document.getElementById('model').textContent = i.provider + ' · ' + i.model + (i.fallback ? ' (+ pollinations احتياطي)' : ''); });

document.getElementById('clear').onclick = () => { messages=[]; save(); log.innerHTML=''; };
t.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('f').requestSubmit(); }});

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const text = t.value.trim(); if(!text) return;
  t.value=''; messages.push({role:'user',content:text}); add('user',text); save();
  send.disabled=true; const wait = add('assistant','...يكتب');
  try{
    const r = await fetch('chat',{method:'POST',headers:{'Content-Type':'application/json','X-App-Password':password},body:JSON.stringify({messages})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      if(r.status===401){ sessionStorage.removeItem('pw'); askPassword(); throw new Error('كلمة المرور غلط، جرّب مرة ثانية'); }
      if(r.status===429){ throw new Error('طلبات كثيرة، استنى دقيقة وجرّب'); }
      throw new Error(data.detail || data.error || r.status);
    }
    wait.textContent = data.reply; messages.push({role:'assistant',content:data.reply}); save();
    if(data.fallback_used){ add('note','المزود الأساسي ما رد، فجاوب Pollinations بداله.'); }
  }catch(err){ wait.remove(); add('error','صار خطأ: '+err.message); messages.pop(); save(); }
  send.disabled=false; t.focus();
};
</script>
</body>
</html>
